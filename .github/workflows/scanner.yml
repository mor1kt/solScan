name: Solana Scanner

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: solana-scanner-scheduled
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DB_PATH: data/solana_scanner.db
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore scanner database
        uses: actions/cache@v4
        with:
          path: data/solana_scanner.db
          key: ${{ runner.os }}-solana-scanner-db-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-solana-scanner-db-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run one bounded scan
        run: python -m src.main run-once
